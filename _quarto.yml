  description: "Advancing Understanding of the Signal-to-noise Paradox and its Impacts on Climate Ensembles"
  favicon: assets/favicon.png
  # Once the site is live, put its address here (used for RSS and social previews):
  # site-url: https://YOUR-GITHUB-USERNAME.github.io/auspice
  page-navigation: false
  navbar:
    logo: assets/auspice-logo-small.png
    logo-alt: "AUSPICE logo"
    title: false
    right:
      - text: "Project"
        href: index.qmd
      - text: "Research"
        href: publications.qmd
      - text: "People"
        href: people.qmd
      - text: "Blog"
        href: blog.qmd
